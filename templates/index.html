<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy - Your AI-Powered Learning Companion</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- marked.js (Markdown parser) & DOMPurify (HTML sanitizer) CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Custom Markdown Typography Styles */
    .prose-study h1, .prose-study h2, .prose-study h3, .prose-study h4 {
      font-weight: 700;
      color: #1e1b4b;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .prose-study h1 { font-size: 1.5rem; }
    .prose-study h2 { font-size: 1.25rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; }
    .prose-study h3 { font-size: 1.1rem; color: #4338ca; }
    .prose-study p {
      margin-bottom: 0.85rem;
      line-height: 1.65;
      color: #334155;
    }
    .prose-study ul {
      list-style-type: disc;
      padding-left: 1.35rem;
      margin-bottom: 0.85rem;
      color: #334155;
    }
    .prose-study ol {
      list-style-type: decimal;
      padding-left: 1.35rem;
      margin-bottom: 0.85rem;
      color: #334155;
    }
    .prose-study li {
      margin-bottom: 0.35rem;
      line-height: 1.6;
    }
    .prose-study blockquote {
      border-left: 4px solid #6366f1;
      padding: 0.5rem 1rem;
      background-color: #f5f3ff;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #4338ca;
      font-style: italic;
      margin: 1rem 0;
    }
    .prose-study code {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 0.15rem 0.4rem;
      border-radius: 0.35rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875em;
    }
    .prose-study pre {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1rem;
      border-radius: 0.75rem;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.875rem;
    }
    .prose-study pre code {
      background-color: transparent;
      color: inherit;
      padding: 0;
    }
    .prose-study table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .prose-study th, .prose-study td {
      border: 1px solid #cbd5e1;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .prose-study th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #1e293b;
    }
    /* Collapsible spoiler details for Quiz Me mode */
    .prose-study details {
      background-color: #f8fafc;
      border: 1.5px solid #e0e7ff;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      margin-top: 1.25rem;
      transition: all 0.2s ease;
    }
    .prose-study details[open] {
      background-color: #faf5ff;
      border-color: #c084fc;
      box-shadow: 0 2px 8px -2px rgba(168, 85, 247, 0.15);
    }
    .prose-study summary {
      cursor: pointer;
      font-weight: 600;
      color: #6366f1;
      user-select: none;
      display: list-item;
      outline: none;
    }
    .prose-study details[open] summary {
      color: #7e22ce;
      margin-bottom: 0.75rem;
    }
    .prose-study strong {
      color: #0f172a;
    }
    
    /* Toast animation */
    @keyframes toastFade {
      0% { opacity: 0; transform: translateY(8px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .animate-toast {
      animation: toastFade 2s ease-in-out forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/40 to-violet-50/50 min-h-screen text-slate-800 antialiased font-sans">
  
  <div class="max-w-4xl mx-auto px-4 py-8 sm:py-12">
    
    <!-- Top Bar with Health Badge -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-medium mb-3 shadow-sm border border-slate-200 bg-white" id="status-badge">
        <span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse" id="status-dot"></span>
        <span id="status-text" class="text-slate-600">Checking AI backend...</span>
      </div>
      
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 via-indigo-700 to-violet-700 bg-clip-text text-transparent">
        🎓 Study Buddy
      </h1>
      <p class="mt-2 text-base sm:text-lg text-slate-600 font-medium">
        Your AI-Powered Learning Companion
      </p>
    </header>

    <!-- Main Container Card -->
    <main class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl shadow-indigo-100/70 border border-indigo-100 p-5 sm:p-8">
      
      <!-- Mode Tabs -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">
            Choose a Study Mode
          </label>
          <span class="text-xs text-indigo-600 font-medium" id="current-mode-description">Friendly peer tutor mode</span>
        </div>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2" role="tablist" id="mode-tabs">
          <button
            type="button"
            data-mode="ask"
            class="mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border shadow-sm"
          >
            <span>💬</span> <span>Ask Questions</span>
          </button>
          
          <button
            type="button"
            data-mode="explain"
            class="mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border shadow-sm"
          >
            <span>💡</span> <span>Explain (ELI5)</span>
          </button>
          
          <button
            type="button"
            data-mode="quiz"
            class="mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border shadow-sm"
          >
            <span>📝</span> <span>Quiz Me</span>
          </button>
          
          <button
            type="button"
            data-mode="summarize"
            class="mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border shadow-sm"
          >
            <span>📄</span> <span>Summarize</span>
          </button>
          
          <button
            type="button"
            data-mode="tips"
            class="mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border shadow-sm"
          >
            <span>🎯</span> <span>Study Tips</span>
          </button>
        </div>
      </div>

      <!-- Input Form -->
      <form id="chat-form" class="space-y-4">
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="prompt-input" class="text-xs font-bold uppercase tracking-wider text-slate-500" id="prompt-label">
              Your Question or Topic
            </label>
            <span class="text-xs text-slate-400 hidden sm:inline">Press <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded text-[10px] font-mono">Ctrl + Enter</kbd> to submit</span>
          </div>
          
          <textarea
            id="prompt-input"
            rows="5"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition duration-150 text-slate-800 placeholder-slate-400 resize-y text-sm sm:text-base outline-none bg-slate-50/50 focus:bg-white"
            placeholder="Type your question or paste your study material..."
            required
          ></textarea>
        </div>

        <!-- Phase 4: Clickable Sample Topic Chips -->
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Try an example:</span>
          </div>
          <div class="flex flex-wrap gap-2" id="example-chips">
            <button
              type="button"
              data-topic="Quantum Computing"
              class="chip-btn px-3 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 hover:bg-indigo-100 hover:text-indigo-900 border border-indigo-200/80 transition duration-150 active:scale-95 flex items-center gap-1"
            >
              <span>⚛️</span> <span>Quantum Computing</span>
            </button>
            <button
              type="button"
              data-topic="Photosynthesis"
              class="chip-btn px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 hover:bg-emerald-100 hover:text-emerald-900 border border-emerald-200/80 transition duration-150 active:scale-95 flex items-center gap-1"
            >
              <span>🌿</span> <span>Photosynthesis</span>
            </button>
            <button
              type="button"
              data-topic="Newton's Laws of Motion"
              class="chip-btn px-3 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 hover:bg-amber-100 hover:text-amber-900 border border-amber-200/80 transition duration-150 active:scale-95 flex items-center gap-1"
            >
              <span>🍎</span> <span>Newton's Laws of Motion</span>
            </button>
            <button
              type="button"
              data-topic="DNA Replication"
              class="chip-btn px-3 py-1 rounded-full text-xs font-medium bg-violet-50 text-violet-700 hover:bg-violet-100 hover:text-violet-900 border border-violet-200/80 transition duration-150 active:scale-95 flex items-center gap-1"
            >
              <span>🧬</span> <span>DNA Replication</span>
            </button>
          </div>
        </div>

        <!-- Error Alert Container -->
        <div id="error-banner" class="hidden rounded-xl bg-rose-50 border border-rose-200 p-3.5 text-sm text-rose-700 flex items-start gap-2">
          <span class="text-base leading-none">⚠️</span>
          <span id="error-message" class="flex-1 font-medium"></span>
          <button type="button" onclick="document.getElementById('error-banner').classList.add('hidden')" class="text-rose-500 hover:text-rose-800 text-xs font-bold">✕</button>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            type="button"
            id="clear-btn"
            class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition duration-150"
          >
            Clear
          </button>
          
          <button
            type="submit"
            id="submit-btn"
            class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl text-sm sm:text-base font-semibold text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 active:scale-[0.98] transition-all duration-150 shadow-md shadow-indigo-200 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
          >
            <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="btn-text">Ask Study Buddy ✨</span>
          </button>
        </div>
      </form>

      <!-- Phase 4 & 5: Result Card with Markdown Rendering, Spoilers & Audio Readout -->
      <section id="result-section" class="hidden mt-8 pt-6 border-t border-slate-100 transition-all duration-500 opacity-0 translate-y-3">
        <div class="bg-gradient-to-br from-indigo-50/40 via-white to-violet-50/30 rounded-2xl p-5 sm:p-7 border border-indigo-100 shadow-sm relative">
          
          <!-- Card Header & Actions -->
          <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-indigo-100/70">
            <div class="flex items-center gap-2.5">
              <span class="text-2xl" id="result-icon">🤖</span>
              <div>
                <h3 class="text-sm sm:text-base font-bold text-slate-900" id="result-title">Study Buddy Response</h3>
                <span id="result-mode-tag" class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wider"></span>
              </div>
            </div>
            
            <!-- Controls Group: Source badge, TTS Speech Controls, Copy -->
            <div class="flex flex-wrap items-center gap-2">
              <span id="source-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold"></span>
              
              <!-- Phase 5: Web Speech Audio Controls -->
              <div id="audio-controls" class="hidden flex items-center gap-1 bg-white border border-slate-200 rounded-xl p-1 shadow-xs">
                <button
                  type="button"
                  id="tts-listen-btn"
                  title="Read aloud"
                  class="px-2 py-1 rounded-lg text-xs font-medium text-indigo-700 hover:bg-indigo-50 flex items-center gap-1 transition"
                >
                  <span>🔊</span> <span id="tts-listen-text">Listen</span>
                </button>
                
                <button
                  type="button"
                  id="tts-pause-btn"
                  title="Pause / Resume speech"
                  class="hidden px-2 py-1 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 flex items-center gap-1 transition"
                >
                  <span id="tts-pause-icon">⏸️</span> <span id="tts-pause-text">Pause</span>
                </button>
                
                <button
                  type="button"
                  id="tts-stop-btn"
                  title="Stop speaking"
                  class="hidden px-2 py-1 rounded-lg text-xs font-medium text-rose-600 hover:bg-rose-50 flex items-center gap-1 transition"
                >
                  <span>⏹️</span> <span>Stop</span>
                </button>
              </div>

              <!-- Phase 4: Copy Markdown Button -->
              <button
                type="button"
                id="copy-btn"
                title="Copy raw Markdown"
                class="px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/50 border border-slate-200 transition duration-150 text-xs flex items-center gap-1.5 font-medium shadow-xs active:scale-95"
              >
                <span>📋</span>
                <span id="copy-text">Copy</span>
              </button>
            </div>
          </div>

          <!-- Note Banner for Demo/Fallback -->
          <div id="result-note-banner" class="hidden mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800 flex items-start gap-2">
            <span>ℹ️</span>
            <span id="result-note" class="flex-1 font-medium"></span>
          </div>

          <!-- Phase 4: Rendered Markdown Content with Spoilers Support -->
          <div id="result-body" class="prose-study text-slate-800 text-sm sm:text-base leading-relaxed font-sans selection:bg-indigo-100"></div>
          
        </div>
      </section>

    </main>

    <!-- Floating 2-second Toast Notification -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg border border-slate-800 flex items-center gap-2">
      <span>✅</span>
      <span id="toast-message">Copied!</span>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-slate-400">
      <p>Study Buddy • Powered by Google Gemini AI (`gemini-3.8-flash`) & Flask</p>
    </footer>

  </div>

  <!-- Client-side Logic -->
  <script>
    // Mode definitions & placeholders
    const MODES = {
      ask: {
        label: "Ask Questions",
        icon: "💬",
        desc: "Friendly peer tutor mode",
        promptLabel: "Your Question",
        placeholder: "What would you like to understand better? (e.g. How does CRISPR gene editing work? Why is the sky blue?)",
      },
      explain: {
        label: "Explain (ELI5)",
        icon: "💡",
        desc: "Feynman technique (simple analogies + In short)",
        promptLabel: "Concept to Explain",
        placeholder: "Enter a concept to explain like you're 10 years old with real-world analogies (e.g. Quantum Computing, Inflation, Blockchain)...",
      },
      quiz: {
        label: "Quiz Me",
        icon: "📝",
        desc: "3 questions with revealable spoiler answers",
        promptLabel: "Topic or Material for Quiz",
        placeholder: "Enter a topic or paste text to generate a 3-question quiz with spoiler answer key (e.g. Photosynthesis, French Revolution)...",
      },
      summarize: {
        label: "Summarize",
        icon: "📄",
        desc: "Core Concept + Key Takeaways + Pitfalls",
        promptLabel: "Notes or Text to Summarize",
        placeholder: "Paste your notes or textbook excerpt here to extract Core Concept, Key Takeaways, and Common Pitfalls...",
      },
      tips: {
        label: "Study Tips",
        icon: "🎯",
        desc: "Active recall + spaced repetition + exam advice",
        promptLabel: "Subject or Exam Target",
        placeholder: "What subject or exam are you preparing for? (e.g. Preparing for Calculus finals, memorizing Organic Chemistry reactions)...",
      }
    };

    let currentMode = "ask";
    let rawMarkdownResponse = "";

    // DOM Elements
    const modeTabs = document.getElementById("mode-tabs");
    const modeButtons = document.querySelectorAll(".mode-btn");
    const modeDescription = document.getElementById("current-mode-description");
    const promptInput = document.getElementById("prompt-input");
    const promptLabel = document.getElementById("prompt-label");
    const exampleChips = document.querySelectorAll(".chip-btn");
    const chatForm = document.getElementById("chat-form");
    const submitBtn = document.getElementById("submit-btn");
    const btnSpinner = document.getElementById("btn-spinner");
    const btnText = document.getElementById("btn-text");
    const clearBtn = document.getElementById("clear-btn");
    const errorBanner = document.getElementById("error-banner");
    const errorMessage = document.getElementById("error-message");
    
    // Result Card Elements
    const resultSection = document.getElementById("result-section");
    const resultBody = document.getElementById("result-body");
    const resultTitle = document.getElementById("result-title");
    const resultIcon = document.getElementById("result-icon");
    const resultModeTag = document.getElementById("result-mode-tag");
    const sourceBadge = document.getElementById("source-badge");
    const resultNoteBanner = document.getElementById("result-note-banner");
    const resultNote = document.getElementById("result-note");
    const copyBtn = document.getElementById("copy-btn");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");
    
    // Status Badge Elements
    const statusBadge = document.getElementById("status-badge");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    // Audio TTS Elements
    const audioControls = document.getElementById("audio-controls");
    const ttsListenBtn = document.getElementById("tts-listen-btn");
    const ttsListenText = document.getElementById("tts-listen-text");
    const ttsPauseBtn = document.getElementById("tts-pause-btn");
    const ttsPauseIcon = document.getElementById("tts-pause-icon");
    const ttsPauseText = document.getElementById("tts-pause-text");
    const ttsStopBtn = document.getElementById("tts-stop-btn");

    // Configure marked options
    marked.setOptions({
      gfm: true,
      breaks: true
    });

    // Switch study mode
    function setMode(modeKey) {
      if (!MODES[modeKey]) return;
      currentMode = modeKey;
      const config = MODES[modeKey];

      modeButtons.forEach(btn => {
        const btnMode = btn.getAttribute("data-mode");
        if (btnMode === modeKey) {
          btn.className = "mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 shadow-md bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-300 ring-offset-1";
        } else {
          btn.className = "mode-btn flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 border border-slate-200 bg-white text-slate-600 hover:bg-indigo-50/80 hover:text-indigo-600 hover:border-indigo-200 shadow-sm";
        }
      });

      modeDescription.textContent = config.desc;
      promptLabel.textContent = config.promptLabel;
      promptInput.placeholder = config.placeholder;
      promptInput.focus();
    }

    modeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        setMode(btn.getAttribute("data-mode"));
      });
    });

    // Clickable Example Chips
    exampleChips.forEach(chip => {
      chip.addEventListener("click", () => {
        const topic = chip.getAttribute("data-topic");
        promptInput.value = topic;
        errorBanner.classList.add("hidden");
        promptInput.focus();
      });
    });

    // Check backend health on load
    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error("Health check failed");
        const data = await res.json();

        if (data.gemini_connected) {
          statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
          statusText.textContent = `Gemini AI Online (${data.model || "gemini-3.8-flash"})`;
          statusBadge.className = "inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-medium mb-3 shadow-sm border border-emerald-200 bg-emerald-50 text-emerald-800";
        } else {
          statusDot.className = "w-2 h-2 rounded-full bg-amber-500";
          statusText.textContent = "Demo Mode (API key not configured)";
          statusBadge.className = "inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-medium mb-3 shadow-sm border border-amber-200 bg-amber-50 text-amber-800";
        }
      } catch (e) {
        statusDot.className = "w-2 h-2 rounded-full bg-slate-400";
        statusText.textContent = "Backend Active";
      }
    }

    // Toggle loading state
    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnSpinner.classList.remove("hidden");
        btnText.textContent = "Thinking... 🧠";
        errorBanner.classList.add("hidden");
        stopAudio(); // Stop any speech in progress
      } else {
        submitBtn.disabled = false;
        btnSpinner.classList.add("hidden");
        btnText.textContent = "Ask Study Buddy ✨";
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove("hidden");
      errorBanner.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function showToast(msg) {
      toastMessage.textContent = msg;
      toast.classList.remove("hidden");
      toast.classList.add("animate-toast");
      setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("animate-toast");
      }, 2000);
    }

    // Form Submission
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();

      if (!prompt) {
        showError("Please enter a question, topic, or notes before submitting.");
        promptInput.focus();
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt,
            mode: currentMode
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const errText = data.error || `Server returned error (${response.status})`;
          throw new Error(errText);
        }

        // Store raw markdown for copying and TTS
        rawMarkdownResponse = data.response || "";

        // Render Markdown with marked & sanitize with DOMPurify
        const parsedHtml = marked.parse(rawMarkdownResponse);
        const cleanHtml = DOMPurify.sanitize(parsedHtml, {
          ADD_TAGS: ['details', 'summary'],
          ADD_ATTR: ['open']
        });
        resultBody.innerHTML = cleanHtml;

        // Card header metadata
        resultIcon.textContent = MODES[currentMode].icon;
        resultTitle.textContent = `${MODES[currentMode].label}`;
        resultModeTag.textContent = `Mode: ${currentMode}`;

        // Source badge
        if (data.source === "gemini") {
          sourceBadge.textContent = "✨ Gemini AI";
          sourceBadge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200";
        } else {
          sourceBadge.textContent = "ℹ️ Demo Fallback";
          sourceBadge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200";
        }

        // Note banner
        if (data.note) {
          resultNote.textContent = data.note;
          resultNoteBanner.classList.remove("hidden");
        } else {
          resultNoteBanner.classList.add("hidden");
        }

        // Show result card with gentle fade-in animation
        resultSection.classList.remove("hidden");
        requestAnimationFrame(() => {
          resultSection.classList.remove("opacity-0", "translate-y-3");
          resultSection.classList.add("opacity-100", "translate-y-0");
        });

        // Initialize TTS controls if supported
        initTTSControls();

        resultSection.scrollIntoView({ behavior: "smooth", block: "start" });

      } catch (error) {
        showError(`Could not get a response: ${error.message}. Please try again.`);
      } finally {
        setLoading(false);
      }
    });

    // Keyboard shortcut: Ctrl+Enter / Cmd+Enter
    promptInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    // Clear Button
    clearBtn.addEventListener("click", () => {
      promptInput.value = "";
      errorBanner.classList.add("hidden");
      promptInput.focus();
    });

    // Phase 4: Copy Markdown button with 2-second Toast
    copyBtn.addEventListener("click", async () => {
      if (!rawMarkdownResponse) return;

      try {
        await navigator.clipboard.writeText(rawMarkdownResponse);
        showToast("Copied to clipboard!");
      } catch (err) {
        // Fallback for older browsers
        const textarea = document.createElement("textarea");
        textarea.value = rawMarkdownResponse;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast("Copied to clipboard!");
      }
    });

    // ==========================================
    // Phase 5: Web Speech API (Text-to-Speech)
    // ==========================================
    const hasSpeech = 'speechSynthesis' in window;
    let synthUtterance = null;
    let isSpeaking = false;
    let isPaused = false;

    function initTTSControls() {
      if (!hasSpeech) {
        audioControls.classList.add("hidden");
        return;
      }
      stopAudio();
      audioControls.classList.remove("hidden");
      ttsListenBtn.classList.remove("hidden");
      ttsPauseBtn.classList.add("hidden");
      ttsStopBtn.classList.add("hidden");
      ttsListenText.textContent = "Listen";
    }

    // Clean Markdown text for natural speech reading
    function cleanTextForSpeech(markdown) {
      if (!markdown) return "";
      
      let clean = markdown;
      
      // Handle <details> answer spoiler: replace with audio-friendly notice so answers aren't blurted out
      clean = clean.replace(/<details>[\s\S]*?<\/details>/gi, " Quiz questions complete. Check the answers on the page when ready.");
      
      // Remove remaining HTML tags
      clean = clean.replace(/<[^>]*>/g, " ");
      
      // Remove headers (# Header)
      clean = clean.replace(/^#{1,6}\s+/gm, "");
      
      // Remove markdown links [text](url) -> text
      clean = clean.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
      
      // Remove image tags ![alt](url)
      clean = clean.replace(/!\[([^\]]*)\]\([^)]+\)/g, "");
      
      // Remove bold/italic markers (* or _)
      clean = clean.replace(/(\*\*|__)(.*?)\1/g, "$2");
      clean = clean.replace(/(\*|_)(.*?)\1/g, "$2");
      
      // Remove blockquotes (>)
      clean = clean.replace(/^>\s+/gm, "");
      
      // Remove code blocks and inline code
      clean = clean.replace(/```[\s\S]*?```/g, "Code example omitted.");
      clean = clean.replace(/`([^`]+)`/g, "$1");
      
      // Clean list bullet symbols
      clean = clean.replace(/^[\*\-\+]\s+/gm, "");
      
      // Replace multiple whitespace/newlines
      clean = clean.replace(/\s+/g, " ").trim();
      
      return clean;
    }

    // Choose natural English voice
    function getPreferredVoice() {
      if (!hasSpeech) return null;
      const voices = window.speechSynthesis.getVoices();
      
      // Prefer Google US English or Microsoft Natural/Online voices if present
      const preferred = voices.find(v => 
        (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Online")) && 
        v.lang.startsWith("en")
      );
      
      if (preferred) return preferred;
      return voices.find(v => v.lang.startsWith("en")) || voices[0] || null;
    }

    function startAudio() {
      if (!hasSpeech) return;
      window.speechSynthesis.cancel();

      const text = cleanTextForSpeech(rawMarkdownResponse);
      if (!text) return;

      synthUtterance = new SpeechSynthesisUtterance(text);
      synthUtterance.rate = 1.0;
      synthUtterance.pitch = 1.0;

      const voice = getPreferredVoice();
      if (voice) synthUtterance.voice = voice;

      synthUtterance.onstart = () => {
        isSpeaking = true;
        isPaused = false;
        ttsListenBtn.classList.add("hidden");
        ttsPauseBtn.classList.remove("hidden");
        ttsStopBtn.classList.remove("hidden");
        ttsPauseIcon.textContent = "⏸️";
        ttsPauseText.textContent = "Pause";
      };

      synthUtterance.onend = () => {
        stopAudio();
      };

      synthUtterance.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') {
          console.warn("Speech error:", e);
        }
        stopAudio();
      };

      window.speechSynthesis.speak(synthUtterance);
    }

    function togglePauseAudio() {
      if (!hasSpeech) return;
      if (isPaused) {
        window.speechSynthesis.resume();
        isPaused = false;
        ttsPauseIcon.textContent = "⏸️";
        ttsPauseText.textContent = "Pause";
      } else {
        window.speechSynthesis.pause();
        isPaused = true;
        ttsPauseIcon.textContent = "▶️";
        ttsPauseText.textContent = "Resume";
      }
    }

    function stopAudio() {
      if (!hasSpeech) return;
      window.speechSynthesis.cancel();
      isSpeaking = false;
      isPaused = false;
      ttsListenBtn.classList.remove("hidden");
      ttsPauseBtn.classList.add("hidden");
      ttsStopBtn.classList.add("hidden");
      ttsListenText.textContent = "Listen";
    }

    ttsListenBtn.addEventListener("click", startAudio);
    ttsPauseBtn.addEventListener("click", togglePauseAudio);
    ttsStopBtn.addEventListener("click", stopAudio);

    // Cancel speech if user navigates or leaves
    window.addEventListener("beforeunload", () => {
      if (hasSpeech) window.speechSynthesis.cancel();
    });

    // Populate voices on Chrome/Edge
    if (hasSpeech && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => getPreferredVoice();
    }

    // Initialize UI on load
    setMode("ask");
    checkHealth();
  </script>
</body>
</html>
